<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Controle Financeiro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="pagina-auth">
  <main class="auth-card">
    <header class="auth-cabecalho">
      <span class="auth-logo" aria-hidden="true">💰</span>
      <h1>Criar conta</h1>
      <p class="auth-subtitulo">Cadastre-se para controlar suas finanças</p>
    </header>

    <div id="mensagem-erro" class="alerta alerta-erro" role="alert" aria-live="assertive" hidden></div>
    <div id="mensagem-sucesso" class="alerta alerta-sucesso" role="status" aria-live="polite" hidden></div>

    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo"
               autocomplete="name" required aria-describedby="erro-nome">
        <small id="erro-nome" class="campo-erro"></small>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@exemplo.com"
               autocomplete="email" required aria-describedby="erro-email">
        <small id="erro-email" class="campo-erro"></small>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres"
                 autocomplete="new-password" required aria-describedby="erro-senha">
          <button type="button" id="btn-mostrar-senha" class="btn-mostrar-senha"
                  aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
        </div>
        <small id="erro-senha" class="campo-erro"></small>
      </div>

      <div class="campo">
        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha"
               autocomplete="new-password" required aria-describedby="erro-confirmar-senha">
        <small id="erro-confirmar-senha" class="campo-erro"></small>
      </div>

      <button type="submit" id="btn-cadastrar" class="btn btn-primario btn-bloco">Cadastrar</button>
    </form>

    <p class="auth-rodape">
      Já tenho conta? <a href="index.html">Entrar</a>
    </p>
  </main>

  <script src="js/app.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
